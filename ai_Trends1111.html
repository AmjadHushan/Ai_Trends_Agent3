<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai_Trends1111</title>
    <link rel ="stylesheet" href="stylesheet.css">
    <script src="chat.js" defer></script>
    <script src="table.js" defer></script>
    <script src="progress.js" defer></script>
</head>
<body>

<h1 class="head">Ai-Trends1111</h1>

<div class="teile">

    <div class="seiten">seiten
        <div class="setting">setting</div>


    </div>











    <div class="chat">
      <div class="chat-box" id="chat-box">
        <div class="msg bot">النظام جاهز بانتظار التشغيل...</div>
      </div>
      <div class="chat-bar">
        <input type="text" id="chat-in" placeholder="اكتب أمراً...">
        <button id="chat-send">إرسال</button>
      </div>
    </div>

    <div class="table-container">
        <table class="table" border="1">
           <tr><td rowspan="2">N</td><td rowspan="2">topic</td><td rowspan="2">key focus</td><td rowspan="2">Count</td><td rowspan="2" >duration/M</td><td colspan="4">Release Date</td></tr>
           <tr><td>D</td><td>M</td><td>J</td><td>H</td></tr>
           <tr><td>1</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
           <tr><td>2</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
           <tr><td>3</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
           <tr><td>4</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
           <tr><td>5</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
           <tr><td>6</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
           <tr><td>7</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
           <tr><td>8</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
        </table>
    </div>

    <div class="buttons">

        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>

        <label class="loop">
          <input type="checkbox">
            <div class="slider">
                <!-- القائمة المنسدلة مدمجة داخل الدائرة البيضاء -->
                <select class="loop-select">
                    <option value="30">30h</option>
                    <option value="60">60h</option>
                    <option value="90">90h</option>
                    <option value="120">120h</option>
                </select>
            </div>
        </label>

        <!-- زر تنظيف البيانات والذاكرة العشوائية -->
        <button class="clean">
            <svg class="clean-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
                Clean Data
        </button>

        <!-- Start Button -->
        <button class="start">
            <svg class="start-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Start
        </button>
    </div>
    
    <div class="progress">progress</div>


</div>






</body>
</html>
